name: Linux AppImage

# Fork-friendly packaging: builds an AppImage from `main` (or on demand) without
# any release secret, so a fork can ship installable builds. Tagged releases
# still go through release.yml, which adds updater metadata.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      release:
        description: Refresh the rolling `appimage-latest` prerelease
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: appimage-${{ github.ref }}
  cancel-in-progress: true

jobs:
  appimage:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # Intentionally optional: with no secrets the renderer keeps its built-in
    # default backend instead of pointing at a private deployment.
    env:
      VITE_WFM_BACKEND_URL: ${{ secrets.VITE_WFM_BACKEND_URL }}
      VITE_WFM_BACKEND_DIRECT_FALLBACK: ${{ vars.VITE_WFM_BACKEND_DIRECT_FALLBACK }}
      VITE_WFM_BACKEND_BOOTSTRAP_ENABLED: ${{ vars.VITE_WFM_BACKEND_BOOTSTRAP_ENABLED }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # electron-builder re-downloads the Electron archive on every cold run.
      - name: Cache Electron downloads
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
          key: ${{ runner.os }}-electron-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-electron-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # wayland-scanner and the protocol XML are build-time only; without them
      # the AppImage silently ships with the layer-shell addon missing.
      - name: Install Wayland build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwayland-dev libwayland-bin wayland-protocols

      - name: Build application
        run: |
          pnpm run verify:onnx-models
          pnpm run build

      - name: Build layer-shell addon
        run: node scripts/build-layer-shell.mjs --require

      - name: Package AppImage
        run: pnpm exec electron-builder --linux AppImage --publish never

      - name: Name the artifact
        id: package
        run: |
          VERSION=$(node -p "require('./package.json').version")
          SHA=$(git rev-parse --short HEAD)
          SOURCE="release/WFHelper-$VERSION.AppImage"
          if [ ! -f "$SOURCE" ]; then
            echo "Missing packaged AppImage: $SOURCE" >&2
            exit 1
          fi
          # Commit-stamped copy for the artifact history, plus a stable filename
          # so the rolling release keeps one permanent download URL. The
          # electron-builder original is removed so nothing is uploaded twice.
          mv "$SOURCE" "release/WFHelper-$VERSION-$SHA.AppImage"
          cp "release/WFHelper-$VERSION-$SHA.AppImage" "release/WFHelper-linux-x86_64.AppImage"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

      - name: Upload AppImage artifact
        uses: actions/upload-artifact@v4
        with:
          name: WFHelper-${{ steps.package.outputs.version }}-linux-x86_64
          path: |
            release/WFHelper-${{ steps.package.outputs.version }}-${{ steps.package.outputs.sha }}.AppImage
            release/WFHelper-linux-x86_64.AppImage
          if-no-files-found: error
          retention-days: 30

      # workflow_dispatch on a non-default branch has no `inputs.release`, and a
      # branch build must not move the rolling release, so gate on `main`.
      - name: Refresh the rolling prerelease
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || inputs.release)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG=appimage-latest
          NOTES="Rolling AppImage built from \`${GITHUB_SHA}\` on $(date -u +%Y-%m-%dT%H:%M:%SZ)."
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" \
              --prerelease --title "Latest Linux AppImage" --notes "$NOTES"
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --prerelease \
              --target "$GITHUB_SHA" --title "Latest Linux AppImage" --notes "$NOTES"
          fi
          # AppImage only: latest-linux.yml belongs to versioned releases so an
          # installed build never auto-updates to a moving development artifact.
          # Commit-stamped builds stay in the workflow artifact; the release
          # keeps only the stable filename so pushes do not accumulate 244 MB
          # assets.
          for old in $(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets \
            --jq '.assets[].name | select(test("^WFHelper-[0-9.]+-[0-9a-f]+\\.AppImage$"))'); do
            gh release delete-asset "$TAG" "$old" --yes --repo "$GITHUB_REPOSITORY"
          done
          gh release upload "$TAG" release/WFHelper-linux-x86_64.AppImage \
            --clobber --repo "$GITHUB_REPOSITORY"
