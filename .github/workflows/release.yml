name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  checks: read

jobs:
  # The tag points at a commit the branch push already ran CI on, and check runs
  # attach to the commit rather than the ref, so the release reads that result
  # instead of re-running the suite. A commit with missing, failed or
  # still-running checks does not get built.
  require-green-ci:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Require green checks on this commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ github.sha }}
        run: |
          # Job names as they appear in check-runs; every CI job is listed so a
          # red one cannot be released around.
          required="validate validate-windows commit-style"
          # Tolerates tagging straight after the branch push, when the branch run
          # has not reported yet.
          for attempt in $(seq 1 40); do
            runs=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${SHA}/check-runs" \
              --paginate --jq '.check_runs[] | "\(.name)=\(.status):\(.conclusion // "-")"' | sort -u)
            echo "$runs"
            pending=0
            for name in $required; do
              line=$(printf '%s\n' "$runs" | grep "^${name}=" | head -1 || true)
              case "$line" in
                "") pending=1 ;;
                *=completed:success) ;;
                *=completed:*) echo "::error::${line} on ${SHA}"; exit 1 ;;
                *) pending=1 ;;
              esac
            done
            if [ "$pending" = 0 ]; then
              echo "required checks are green on ${SHA}"
              exit 0
            fi
            sleep 30
          done
          echo "::error::required checks never reported green on ${SHA}"
          echo "::error::push the branch and let CI finish before tagging"
          exit 1

  release-windows:
    needs: require-green-ci
    runs-on: windows-latest
    # Normally ~3 min; a stalled runner should go red, not sit for 6 hours.
    timeout-minutes: 20

    # Optional on a fork: unset values keep the renderer's built-in backend, and
    # the validation step below only runs when a backend URL is configured.
    env:
      VITE_WFM_BACKEND_URL: ${{ secrets.VITE_WFM_BACKEND_URL }}
      VITE_WFM_BACKEND_DIRECT_FALLBACK: ${{ vars.VITE_WFM_BACKEND_DIRECT_FALLBACK }}
      VITE_WFM_BACKEND_BOOTSTRAP_ENABLED: ${{ vars.VITE_WFM_BACKEND_BOOTSTRAP_ENABLED }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # The tag is the version; package.json in the repo is only a dev placeholder.
      # Must run before install: editing package.json afterwards makes pnpm re-sync
      # deps inside the next `pnpm run`, which has wedged Windows runners.
      - name: Set version from tag
        shell: bash
        run: pnpm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate release credentials
        shell: pwsh
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if (-not $env:GH_TOKEN) {
            throw "Missing required release secret: GH_TOKEN"
          }

          $hasSigningCert = -not [string]::IsNullOrWhiteSpace($env:CSC_LINK)
          $hasSigningPassword = -not [string]::IsNullOrWhiteSpace($env:CSC_KEY_PASSWORD)
          if ($hasSigningCert -ne $hasSigningPassword) {
            throw "CSC_LINK and CSC_KEY_PASSWORD must be configured together"
          }

          if (-not $hasSigningCert) {
            Write-Warning "CSC_LINK/CSC_KEY_PASSWORD are not configured; building an unsigned Windows installer."
          }

      # node directly: the script has no deps, keep pnpm's run lifecycle out of it
      - name: Validate release runtime configuration
        if: env.VITE_WFM_BACKEND_URL != ''
        run: node scripts/validate-release-env.mjs

      - name: Ensure release exists
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "$env:GITHUB_REF_NAME" --repo "$env:GITHUB_REPOSITORY" *> $null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Release $env:GITHUB_REF_NAME already exists"
          } else {
            # Draft: paste the changelog, then Publish (which fires announce-release.yml).
            gh release create "$env:GITHUB_REF_NAME" `
              --repo "$env:GITHUB_REPOSITORY" `
              --title "$env:GITHUB_REF_NAME" `
              --draft `
              --generate-notes
            if ($LASTEXITCODE -ne 0) { throw "Failed to create release $env:GITHUB_REF_NAME" }
            Write-Host "Created draft release $env:GITHUB_REF_NAME"
          }

      - name: Build Windows installer
        run: |
          pnpm run verify:onnx-models
          pnpm run build
          pnpm exec electron-builder --win nsis --publish never
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}

      - name: Verify packaged Windows runtime
        run: pnpm run test:packaged release/win-unpacked/WFHelper.exe

      - name: Verify sustained overlay lifecycle
        run: pnpm run test:overlay-stress

      - name: Preserve failed acceptance evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: windows-release-acceptance
          path: test-results/
          if-no-files-found: ignore

      - name: Upload release assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $pkg = Get-Content package.json | ConvertFrom-Json
          $productName = $pkg.build.productName
          $version = $pkg.version
          $paths = @(
            "release/latest.yml",
            "release/$productName-$version-Setup.exe",
            "release/$productName-$version-Setup.exe.blockmap"
          )

          foreach ($path in $paths) {
            if (-not (Test-Path $path)) {
              throw "Missing release asset: $path"
            }
          }

          gh release upload "$env:GITHUB_REF_NAME" $paths --clobber --repo "$env:GITHUB_REPOSITORY"

  # Linux AppImage into the same draft release (latest-linux.yml enables
  # electron-updater on linux). Independent of release-windows so a fork without
  # Windows signing secrets still ships Linux builds; the draft creation below is
  # idempotent and tolerates either job finishing first.
  release-linux:
    needs: require-green-ci
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      VITE_WFM_BACKEND_URL: ${{ secrets.VITE_WFM_BACKEND_URL }}
      VITE_WFM_BACKEND_DIRECT_FALLBACK: ${{ vars.VITE_WFM_BACKEND_DIRECT_FALLBACK }}
      VITE_WFM_BACKEND_BOOTSTRAP_ENABLED: ${{ vars.VITE_WFM_BACKEND_BOOTSTRAP_ENABLED }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # The tag is the version; package.json in the repo is only a dev placeholder.
      # Must run before install: editing package.json afterwards makes pnpm re-sync
      # deps inside the next `pnpm run`, which has wedged Windows runners.
      - name: Set version from tag
        shell: bash
        run: pnpm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # node directly: the script has no deps, keep pnpm's run lifecycle out of it
      - name: Validate release runtime configuration
        if: env.VITE_WFM_BACKEND_URL != ''
        run: node scripts/validate-release-env.mjs

      # release-linux no longer waits for release-windows, so whichever job runs
      # first creates the draft. `gh release view` makes this idempotent.
      - name: Ensure release exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists"
          else
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
              --title "$GITHUB_REF_NAME" --draft --generate-notes
            echo "Created draft release $GITHUB_REF_NAME"
          fi

      # wayland-scanner and the protocol XML are build-time only; without them
      # build-layer-shell skips and the AppImage ships with the addon missing.
      - name: Install Wayland build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwayland-dev libwayland-bin wayland-protocols

      - name: Build Linux AppImage
        run: |
          pnpm run verify:onnx-models
          pnpm run build
          node scripts/build-layer-shell.mjs --require
          pnpm exec electron-builder --linux AppImage --publish never

      - name: Verify packaged Linux runtime
        run: |
          pnpm exec playwright install-deps chromium
          PRODUCT_NAME=$(node -p "require('./package.json').build.productName")
          VERSION=$(node -p "require('./package.json').version")
          xvfb-run -a pnpm run test:packaged "release/$PRODUCT_NAME-$VERSION.AppImage"

      - name: Preserve failed acceptance evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: linux-release-acceptance
          path: test-results/
          if-no-files-found: ignore

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PRODUCT_NAME=$(node -p "require('./package.json').build.productName")
          VERSION=$(node -p "require('./package.json').version")
          PATHS=("release/latest-linux.yml" "release/$PRODUCT_NAME-$VERSION.AppImage")
          for path in "${PATHS[@]}"; do
            if [ ! -f "$path" ]; then
              echo "Missing release asset: $path" >&2
              exit 1
            fi
          done
          gh release upload "$GITHUB_REF_NAME" "${PATHS[@]}" --clobber --repo "$GITHUB_REPOSITORY"
